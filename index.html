<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Démonstration interactive de GoldLog, outil de pilotage logistique : demandes de transport, packing lists, déchets, RMA. Données entièrement fictives.">
<title>GoldLog Démo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : barre latérale de navigation (comme l'application de bureau), zone de travail, panneau d'aperçu à droite. */
:root {
  --bg: #f3f2ee; --surface: #ffffff; --surface-2: #f8f7f3; --line: #e2dfd6; --line-strong: #cfcabd;
  --fg: #1d2129; --muted: #667085; --accent: #b4902f; --accent-strong: #8f701f; --accent-soft: #f6efdb;
  --ink: #111827; --ink-2: #1e293b; --on-ink: #f8fafc; --on-ink-muted: #cbd5e1; --amber: #fbbf24;
  --todo-bg: #fee2e2; --todo-fg: #b91c1c; --prog-bg: #fef9c3; --prog-fg: #a16207;
  --wait-bg: #e0f2fe; --wait-fg: #0369a1; --done-bg: #dcfce7; --done-fg: #15803d; --off-bg: #eef1f5; --off-fg: #475569;
  --note-bg: #fffbeb; --note-line: #d97706; --alert-bg: #fef2f2; --alert-line: #dc2626;
  --info-bg: #e0f2fe; --info-fg: #0c4a6e; --info-line: #0369a1;
  --shadow: 0 1px 2px rgba(17,24,39,.06), 0 6px 20px rgba(17,24,39,.06);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --surface-2: #20252f; --line: #2c323d; --line-strong: #3a414e;
  --fg: #e7e9ee; --muted: #9aa3b2; --accent: #d4ad4a; --accent-strong: #e5c46b; --accent-soft: #2e2817;
  --ink: #0b0e13; --ink-2: #161b24; --on-ink: #f8fafc; --on-ink-muted: #b6c0cf; --amber: #fbbf24;
  --todo-bg: #3b1717; --todo-fg: #fca5a5; --prog-bg: #3a3311; --prog-fg: #fde047;
  --wait-bg: #0f2c3d; --wait-fg: #7dd3fc; --done-bg: #12321f; --done-fg: #86efac; --off-bg: #262b34; --off-fg: #aab4c3;
  --note-bg: #2f2510; --note-line: #f59e0b; --alert-bg: #351818; --alert-line: #f87171;
  --info-bg: #0f2c3d; --info-fg: #bae6fd; --info-line: #38bdf8;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --surface-2: #20252f; --line: #2c323d; --line-strong: #3a414e;
  --fg: #e7e9ee; --muted: #9aa3b2; --accent: #d4ad4a; --accent-strong: #e5c46b; --accent-soft: #2e2817;
  --ink: #0b0e13; --ink-2: #161b24; --on-ink: #f8fafc; --on-ink-muted: #b6c0cf; --amber: #fbbf24;
  --todo-bg: #3b1717; --todo-fg: #fca5a5; --prog-bg: #3a3311; --prog-fg: #fde047;
  --wait-bg: #0f2c3d; --wait-fg: #7dd3fc; --done-bg: #12321f; --done-fg: #86efac; --off-bg: #262b34; --off-fg: #aab4c3;
  --note-bg: #2f2510; --note-line: #f59e0b; --alert-bg: #351818; --alert-line: #f87171;
  --info-bg: #0f2c3d; --info-fg: #bae6fd; --info-line: #38bdf8;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.caps { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--muted); }

/* bandeau démo */
.demo-band { background: var(--ink); color: var(--on-ink); padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
.demo-band b { color: var(--amber); font-family: var(--f-display); font-size: 15px; letter-spacing: .04em; }
.demo-band .sp { flex: 1; }
.demo-band button { background: transparent; border: 1px solid #475569; color: var(--on-ink); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
.demo-band button.primary { background: var(--amber); color: #111827; border-color: var(--amber); font-weight: 700; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 40px); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
@media (min-width: 761px) { .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; } }
.brand { display: flex; align-items: baseline; gap: 6px; padding: 0 8px 14px; }
.brand .logo { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .02em; }
.brand .logo span { color: var(--accent); }
.brand .ver { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.company { padding: 0 8px 12px; margin-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.company b { color: var(--fg); display: block; font-size: 13px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
.nav a .ic { width: 18px; text-align: center; }
.nav a .badge { margin-left: auto; background: var(--todo-fg); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.nav .sep { margin: 10px 10px 4px; }
.side .foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--muted); }

.main { min-width: 0; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.page-head h1 { font-size: 30px; font-weight: 800; }
.page-head p { margin: 0; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.go { background: var(--done-fg); border-color: var(--done-fg); color: #fff; font-weight: 700; }
:root[data-theme="dark"] .btn.go, :root[data-theme="dark"] .btn.accent { color: #111827; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.go, :root:not([data-theme="light"]) .btn.accent { color: #111827; } }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.search { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 10px; }
select.sel { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 1px solid transparent; border-bottom: none; background: transparent; padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); font-weight: 600; }
.tabs button.on { background: var(--surface); border-color: var(--line); color: var(--fg); margin-bottom: -1px; }

.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-todo { background: var(--todo-bg); color: var(--todo-fg); } .st-prog { background: var(--prog-bg); color: var(--prog-fg); }
.st-wait { background: var(--wait-bg); color: var(--wait-fg); } .st-done { background: var(--done-bg); color: var(--done-fg); }
.st-off { background: var(--off-bg); color: var(--off-fg); }
.new-tag { background: var(--alert-line); color: #fff; border-radius: 4px; padding: 0 5px; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; }

/* tableau de bord */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid var(--line-strong); }
.kpi .n { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi.todo { border-left-color: var(--todo-fg); } .kpi.prog { border-left-color: var(--prog-fg); }
.kpi.wait { border-left-color: var(--wait-fg); } .kpi.done { border-left-color: var(--done-fg); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.list { display: flex; flex-direction: column; }
.list .row { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.list .row:hover { background: var(--surface-2); }
.list .row .grow { flex: 1; min-width: 0; }
.list .row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list h2 { font-size: 19px; padding: 14px 16px 10px; }
.intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 20px;
  background: linear-gradient(100deg, var(--ink) 0%, var(--ink-2) 100%); color: var(--on-ink); border-radius: var(--radius); }
.intro h2 { font-size: 24px; color: var(--on-ink); }
.intro p { margin: 6px 0 0; color: var(--on-ink-muted); max-width: 70ch; }
.intro .btn.accent { color: #111827; background: var(--amber); border-color: var(--amber); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 12.5px; color: var(--on-ink-muted); align-items: center; }
.flow span.s { border: 1px solid #475569; border-radius: 999px; padding: 2px 10px; color: var(--on-ink); }

/* demandes : tableau de suivi + aperçu */
.board-wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.col { border-radius: var(--radius); padding: 8px; min-height: 420px; border-top: 4px solid; display: flex; flex-direction: column; gap: 8px; }
.col.todo { background: color-mix(in srgb, var(--todo-bg) 55%, var(--bg)); border-color: var(--todo-fg); }
.col.prog { background: color-mix(in srgb, var(--prog-bg) 55%, var(--bg)); border-color: var(--prog-fg); }
.col.wait { background: color-mix(in srgb, var(--wait-bg) 55%, var(--bg)); border-color: var(--wait-fg); }
.col-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; padding: 2px 4px; }
.col-head .cnt { background: var(--surface); border-radius: 6px; padding: 0 8px; font-size: 12px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: 8px; padding: 9px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.rcard:hover { border-color: var(--accent); }
.rcard.sel { outline: 2px solid var(--accent); }
.rcard .top { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); }
.rcard .top b { color: var(--fg); font-family: var(--f-mono); font-size: 11.5px; }
.rcard .route { font-weight: 700; font-size: 14px; }
.rcard .route .arr { color: var(--accent); }
.rcard .co { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcard .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.mini { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.mini.msg { background: var(--note-bg); border-color: var(--note-line); color: var(--fg); font-weight: 700; }
.empty { color: var(--muted); text-align: center; padding: 22px 6px; font-size: 13px; }

/* fiche résumé (aperçu et fiche) */
.ov { display: flex; flex-direction: column; gap: 10px; }
.ov-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ov-head .ref { color: var(--muted); font-weight: 600; font-size: 12.5px; font-family: var(--f-mono); }
.ov-head h3 { font-size: 21px; font-weight: 800; }
.routecard { background: linear-gradient(90deg, var(--ink), var(--ink-2)); border-radius: 12px; padding: 14px 16px; color: var(--on-ink); display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: center; }
.routecard .cap { color: var(--amber); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.routecard .city { font-family: var(--f-display); font-size: 25px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.routecard .det { color: var(--on-ink-muted); font-size: 12px; }
.routecard .r { text-align: right; } .routecard .r .cap { color: var(--on-ink-muted); }
.routecard .mid { font-size: 22px; color: var(--amber); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 21px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.tile .d { color: var(--muted); font-size: 12px; }
.tile.urg-std .v { color: var(--done-fg); } .tile.urg-std { background: color-mix(in srgb, var(--done-bg) 60%, var(--surface)); border-color: var(--done-fg); }
.tile.urg-exp .v { color: var(--todo-fg); } .tile.urg-exp { background: color-mix(in srgb, var(--todo-bg) 60%, var(--surface)); border-color: var(--todo-fg); }
.tile.val-missing .v { color: var(--note-line); }
[data-zone] { cursor: pointer; }
[data-zone]:hover { border-color: var(--accent); }
.pk { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; }
.pk table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pk th { text-align: left; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px 2px 0; }
.pk td { padding: 2px 6px 2px 0; font-variant-numeric: tabular-nums; }
.pk .tot { font-family: var(--f-display); font-weight: 800; font-size: 16px; }
.notices { border: 2px solid var(--note-line); border-left-width: 8px; background: var(--note-bg); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.notices.alert { border-color: var(--alert-line); background: var(--alert-bg); }
.notice .h { font-weight: 700; font-size: 12.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.notice .x { white-space: pre-wrap; }
.dossier { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; }
.files { display: flex; flex-wrap: wrap; gap: 8px; }
.file { width: 104px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 6px; text-align: center; font-size: 11px; cursor: pointer; background: var(--surface); }
.file:hover { border-color: var(--accent); }
.file .ext { display: inline-block; margin: 0 auto 4px; width: 34px; height: 40px; border-radius: 4px; position: relative; background: var(--surface-2); border: 1px solid var(--line-strong); }
.file .ext span { position: absolute; left: -4px; right: -4px; bottom: 5px; background: #dc2626; color: #fff; font-size: 9px; font-weight: 800; border-radius: 2px; }
.file .ext.xls span { background: #15803d; } .file .ext.img span { background: #7c3aed; } .file .ext.doc span { background: #1d4ed8; }
.file .nm { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { font-size: 12px; color: var(--muted); }

/* liste complète */
.state-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.state-tile { border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; background: var(--surface); text-align: left; border-left: 5px solid; }
.state-tile .n { font-family: var(--f-display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.state-tile.on { outline: 2px solid var(--accent); }
.tablewrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid tr.click { cursor: pointer; } table.grid tr.click:hover td { background: var(--surface-2); }
.bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 90px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.link { color: var(--accent-strong); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; font-weight: 600; }

/* fiche de la demande (fenêtre) */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 40; display: flex; align-items: flex-start; justify-content: center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(1380px, 100%); background: var(--bg); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; }
.modal-title { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.modal-title b { font-family: var(--f-mono); }
.modal-title .sp { flex: 1; }
.modal-body { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.25fr); gap: 16px; padding: 16px; }
.right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.right-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.right-head h3 { font-size: 21px; }
.right-head .next { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.right-head .next b { color: var(--accent-strong); }
.step { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.step > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: none; background: transparent; text-align: left; }
.step .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; background: var(--off-bg); color: var(--off-fg); }
.step.done .dot { background: var(--done-bg); color: var(--done-fg); }
.step.cur { border-color: var(--accent); }
.step.cur .dot { background: var(--accent); color: #fff; }
.step .ttl { font-weight: 700; }
.step .inf { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
.step .body { padding: 2px 14px 14px 50px; display: flex; flex-direction: column; gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 12px; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld label { font-size: 11.5px; color: var(--muted); font-weight: 600; }

function barChart(data, { unit = "", color = "var(--accent)", label = "" } = {}) {
  const W = 560, H = 220, L = 46, B = 30, T = 14, R = 10;
  const max = Math.max(...data.map((d) => d[1])); const step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const top = Math.ceil(max / step) * step; const y = (v) => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / data.length;
  let g = ""; for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toLocaleString("fr-CH").replace(/ | /g, "'")}</text>`;
  data.forEach((d, i) => { const x = L + i * bw + bw * 0.2; g += `<rect x="${x}" y="${y(d[1])}" width="${bw * 0.6}" height="${y(0) - y(d[1])}" rx="3" fill="${color}"><title>${d[0]} : ${d[1]} ${unit}</title></rect>
    <text x="${x + bw * 0.3}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${d[0]}</text>
    <text x="${x + bw * 0.3}" y="${y(d[1]) - 4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">${d[1].toLocaleString("fr-CH").replace(/ | /g, "'")}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" style="width:100%;height:auto">${g}</svg>`;
}
function viewStats() {

    <div class="tiles">
      <div class="tile" data-zone="mode" title="Double-clic : modifier le mode de transport"><div class="caps">Mode de transport</div><div class="v">${MODE_ICON[r.mode] || ""} ${esc(r.mode)}</div><div class="d">Incoterm ${esc(r.incoterm)}</div></div>
      <div class="tile ${urgCls}" data-zone="urgency" title="Double-clic : modifier l'urgence"><div class="caps">Urgence demandée</div><div class="v">● ${esc(r.urgency)}</div><div class="d">${r.urgency === "Express" ? "départ dès que possible" : "enlèvement au plus vite · livraison indifférente"}</div></div>
      <div class="tile" data-zone="goods" title="Double-clic : modifier la marchandise"><div class="caps">Marchandise</div><div class="v">${esc(r.goods[0].label)}</div><div class="d">${r.goods.map((g) => `${g.qty} × ${esc(g.label)} · HS ${esc(g.hs)}`).join("<br>")}</div></div>
      <div class="tile ${r.value == null ? "val-missing" : ""}" data-zone="value" title="Double-clic : modifier la valeur"><div class="caps">Valeur</div><div class="v num">${esc(chf(r.value))}</div><div class="d">${r.value == null ? "aucune valeur saisie : facture attendue" : chf(r.value / qty) + " / pièce"}</div></div>
    </div>
    <div class="pk" data-zone="packages" title="Double-clic : modifier les colis">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span class="caps">Colis</span><span class="tot num">${t.count} colis · ${kg(t.weight)}</span></div>
      <table><thead><tr><th>Nombre</th><th>Type</th><th>Dimensions (cm)</th><th>Poids / u</th></tr></thead>
      <tbody>${r.packages.map((p) => `<tr><td>${p.count} ×</td><td>${esc(p.type)}</td><td><b>${p.dims.join(" × ")}</b></td><td>${kg(p.kg)}</td></tr>`).join("")}</tbody></table>
      <div class="muted small">volume ${t.volume.toFixed(2)} m³${r.mode === "Aérien" || r.mode === "Express" ? ` · poids taxable aérien ≈ ${kg(Math.max(t.weight, t.volume * 1e6 / 6000))}` : ""}</div>
    </div>
    ${pl ? `<div class="dossier"><div class="caps">Dossier packing list</div><div><b>📦 ${esc(pl.ref)}</b> · ${esc(pl.title)}</div>
      <div class="actions" style="margin-top:6px"><button class="btn" type="button" data-pl="${esc(pl.ref)}">Ouvrir la packing list ▸</button></div></div>` : ""}
    <div class="caps">Pièces jointes (${r.files.length})${plDocs.length ? ` + ${plDocs.length} du dossier packing list` : ""} · un clic pour ouvrir</div>
    <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div class="files" style="flex:1;min-width:0">${[...r.files, ...plDocs].map((f) => `<div class="file" data-file="${esc(f)}" title="${esc(f)}"><div class="ext ${fileExt(f)}"><span>${esc(f.split(".").pop().toUpperCase())}</span></div><div class="nm">${esc(f)}</div></div>`).join("") || '<span class="muted small">Aucune pièce jointe.</span>'}</div>
      <button class="btn accent" type="button" data-act="dl-all" ${r.files.length + plDocs.length ? "" : "disabled"}>⬇ Tout télécharger</button>
    </div>
    ${inModal ? "" : `${ui.confirmDepart === r.id ? `<div class="confirm"><span>${esc(r.number)} : départ le <b>${dfmt(today)}</b> ? La demande passe en « Expédiée », la packing list et la page de suivi du demandeur sont mises à jour.</span>
        <button class="btn go" type="button" data-act="depart-yes">Confirmer le départ</button><button class="btn" type="button" data-act="depart-no">Annuler</button></div>` : ""}
      <div class="actions" id="tour-actions">
        ${r.state === "attente enlèvement" ? '<button class="btn go" type="button" data-act="depart">🚚 Valider le départ</button>' : ""}
        <button class="btn accent" type="button" data-open="${r.id}">Traiter la demande ▸</button>
        <button class="btn" type="button" data-act="copy-link">Copier le lien de suivi</button></div>
      <div class="hint">Astuce : un double clic sur une zone (trajet, mode, urgence, marchandise, valeur, colis) ouvre la demande directement sur le champ à modifier.</div>`}
  </div>`;
}

function viewRequests() {
  const cols = ["à traiter", "en cours", "attente enlèvement"];
  const sel = reqById(ui.selected) || S.requests[0];
  const q = ui.search.toLowerCase();
  const match = (r) => !q || [r.number, r.requester, r.from.company, r.to.company, r.from.city, r.to.city, ...r.goods.map((g) => g.label)].join(" ").toLowerCase().includes(q);
  const card = (r) => `<button type="button" class="rcard ${r.id === sel.id ? "sel" : ""}" data-sel="${r.id}" style="border-left-color:var(--${STATES[r.state][2]}-fg)">
      <span class="top"><b>${esc(r.number)}</b><span>${dshort(r.submitted)} ${r.submitted.toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" })}</span></span>
      <span class="route">${esc(r.from.city)} <span class="arr">→</span> ${esc(r.to.city)}</span>
      <span class="co">${esc(r.from.company)} → ${esc(r.to.company)}</span>
      <span class="chips"><span class="mini">${MODE_ICON[r.mode] || ""} ${esc(r.mode)}</span><span class="mini">${esc(r.urgency)}</span>${unread(r) ? '<span class="mini msg">💬 nouveau message</span>' : ""}${r.quotes && r.quotes.some((x) => x.state === "Soumise au demandeur") ? '<span class="mini">validation demandeur</span>' : ""}</span>
      <span class="co">👤 ${esc(r.requester)}${r.departure && r.state === "attente enlèvement" ? " · départ " + dshort(r.departure) : ""}</span></button>`;
  const board = `<div class="board-wrap">
    <div class="board" id="tour-board">${cols.map((st) => { const rs = S.requests.filter((r) => r.state === st && match(r));
      return `<div class="col ${STATES[st][2]}"><div class="col-head"><span style="color:var(--${STATES[st][2]}-fg)">● ${STATES[st][0]}</span><span class="cnt">${rs.length}</span></div>${rs.map(card).join("") || '<div class="empty">Aucune demande</div>'}</div>`; }).join("")}</div>
    <div class="card pad">${overview(sel)}</div></div>`;
  const counts = Object.keys(STATES).map((st) => [st, S.requests.filter((r) => r.state === st).length]);
  const rows = S.requests.filter((r) => (!ui.listFilter || r.state === ui.listFilter) && match(r));
  const list = `<div class="state-tiles">${counts.map(([st, n]) => `<button type="button" class="state-tile ${ui.listFilter === st ? "on" : ""}" data-filter="${st}" style="border-left-color:var(--${STATES[st][2]}-fg)"><div class="n">${n}</div><div class="muted small">${STATES[st][0]}</div></button>`).join("")}</div>
    <div class="card tablewrap"><table class="grid"><thead><tr><th>N°</th><th>Statut</th><th>Déposée</th><th>Demandeur</th><th>Trajet</th><th>Mode</th><th>Urgence</th><th>Marchandise</th><th class="num">Valeur</th><th>Transporteur</th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="click" data-sel-open="${r.id}"><td class="mono"><b>${esc(r.number)}</b></td><td>${stateChip(r.state)}${unread(r) ? ' <span class="new-tag">NOUVEAU</span>' : ""}</td><td class="num">${dfmt(r.submitted)}</td><td>${esc(r.requester)}</td>
      <td>${esc(r.from.city)} → <b>${esc(r.to.city)}</b><div class="muted small">${esc(r.to.country)}</div></td><td>${esc(r.mode)}</td><td>${esc(r.urgency)}</td><td>${esc(r.goods[0].label)}${r.goods.length > 1 ? ` <span class="muted">+${r.goods.length - 1}</span>` : ""}</td>
      <td class="num">${r.value == null ? '<span class="muted">à déterminer</span>' : chf(r.value)}</td><td>${esc(r.quotes ? (r.quotes.find((x) => ["Retenue", "Validée"].includes(x.state)) || r.quotes[0]).carrier : "")}</td></tr>`).join("") || '<tr><td colspan="10" class="empty">Aucune demande pour ce filtre.</td></tr>'}</tbody></table></div>`;
  return `<div class="page-head"><h1>Demandes de transport</h1><p>Reçues du portail des demandeurs, relevées automatiquement.</p></div>
    <div class="toolbar"><input class="search" id="q" type="search" placeholder="Rechercher : n°, demandeur, société, ville, article…" value="${esc(ui.search)}">
      <button class="btn" type="button" data-act="sync">⟳ Relever le portail</button><button class="btn" type="button" data-go="portail">🌐 Voir le portail des demandeurs</button></div>
    <div class="tabs"><button type="button" class="${ui.tab === "board" ? "on" : ""}" data-tab="board">▦ Tableau de suivi (${S.requests.filter((r) => cols.includes(r.state)).length})</button>
      <button type="button" class="${ui.tab === "list" ? "on" : ""}" data-tab="list">☰ Toutes les demandes (${S.requests.length})</button></div>
    ${ui.tab === "board" ? board : list}`;
}

/* ───────────────────────── fiche de la demande ───────────────────────── */
function steps(r) {
  const q = r.quotes || [];
  const order = ["à traiter", "en cours", "attente enlèvement", "expédiée"];
  const idx = order.indexOf(r.state);
  const chosen = q.find((x) => ["Retenue", "Validée"].includes(x.state));
  return [
    { key: "need", n: 1, title: "Besoin reçu", info: `déposée le ${dfmt(r.submitted)} par ${r.requester}`, done: true },
    { key: "quote", n: 2, title: "Cotation et validation", info: chosen ? `${chosen.carrier} · ${chf(chosen.amount)}` : q.length ? `${q.length} offre(s) · validation du demandeur` : "demander une cotation", done: idx >= 2 || !!chosen, cur: idx <= 1 && !chosen },
    { key: "transport", n: 3, title: "Transport et départ", info: r.departure ? `départ ${dfmt(r.departure)}${r.tracking ? " · " + r.tracking : ""}` : "date de départ, n° de suivi", done: idx >= 2, cur: idx === 1 && !!chosen },
    { key: "docs", n: 4, title: "Pièces pour le demandeur", info: idx >= 2 ? "étiquette et suivi publiés" : "étiquette, confirmation", done: idx >= 2 },
    { key: "close", n: 5, title: "Clôture et enlèvement", info: r.state === "expédiée" ? `expédiée le ${dfmt(r.departure || today)}` : idx === 2 ? "attente enlèvement : valider le départ" : "", done: idx >= 3, cur: idx === 2 },
  ];
}
function quoteMail(r) {
  const t = totals(r);
  return { to: "devis@airfret-alpin.example · devis@swiftcargo.example", subject: `Demande de cotation ${r.number} · ${r.kind} ${r.mode} ${r.from.city} → ${r.to.city}`,
    body: `Bonjour,\n\nMerci de nous transmettre votre meilleure offre pour l'envoi suivant :\n\n• Trajet : ${r.from.company}, ${r.from.city} (${r.from.country}) → ${r.to.company}, ${r.to.city} (${r.to.country})\n• Mode : ${r.mode} · urgence ${r.urgency} · Incoterm ${r.incoterm}\n• Colis : ${r.packages.map((p) => `${p.count} × ${p.type} ${p.dims.join(" x ")} cm, ${p.kg} kg/u`).join(" ; ")}\n• Poids total : ${kg(t.weight)} · volume ${t.volume.toFixed(2)} m³\n• Marchandise : ${r.goods.map((g) => `${g.qty} × ${g.label} (HS ${g.hs})`).join(", ")}\n• Valeur : ${chf(r.value)}\n\nMerci d'indiquer le délai de transit et la validité de l'offre.\n` };
}
function modalView() {
  const r = reqById(ui.modal); if (!r) return "";
  const st = steps(r);
  const cur = st.find((s) => s.cur);
  const open = ui.openStep || (cur ? cur.key : "close");
  const quotes = r.quotes || [];
  const body = (s) => {
    if (s.key === "need") return `<div class="muted">Demande déposée sur le portail par ${esc(r.requester)}. Les informations clés sont reprises à gauche ; la marchandise est complétée avec le catalogue (poids, dimensions, code HS).</div>`;
    if (s.key === "quote") return `
      <div class="actions"><button class="btn accent" type="button" data-act="mail">✉ Créer le brouillon de demande de cotation</button><button class="btn" type="button" data-act="add-quote">+ Enregistrer une offre reçue</button></div>
      ${ui.mail ? `<div class="mail"><div class="mh"><span>À</span><span>${esc(ui.mail.to)}</span><span>Objet</span><span>${esc(ui.mail.subject)}</span><span>État</span><span><span class="draft-tag">BROUILLON dans Outlook</span> à relire puis envoyer</span></div><pre>${esc(ui.mail.body)}</pre><div class="sig">${esc(SIGN).replace(/\n/g, "<br>")}</div></div>` : ""}
      ${quotes.length ? `<div class="tablewrap"><table class="grid"><thead><tr><th>Transporteur</th><th class="num">Montant</th><th>Délai</th><th>État</th><th></th></tr></thead><tbody>
        ${quotes.map((x, i) => `<tr><td>${esc(x.carrier)}</td><td class="num">${chf(x.amount)}</td><td>${esc(x.transit)}</td><td>${esc(x.state)}</td><td>${["Retenue", "Validée"].includes(x.state) ? "✓" : `<button class="btn" type="button" data-keep="${i}">Retenir</button>`}</td></tr>`).join("")}</tbody></table></div>` : '<div class="muted small">Aucune offre enregistrée.</div>'}`;
    if (s.key === "transport") return `<div class="form-grid">
        <div class="fld"><label for="f-mode">Mode</label><select id="f-mode">${["Route", "Aérien", "Maritime", "Express"].map((m) => `<option ${m === r.mode ? "selected" : ""}>${m}</option>`).join("")}</select></div>
        <div class="fld"><label for="f-urg">Urgence</label><select id="f-urg">${["Économique", "Standard", "Express"].map((m) => `<option ${m === r.urgency ? "selected" : ""}>${m}</option>`).join("")}</select></div>
        <div class="fld"><label for="f-inco">Incoterm</label><select id="f-inco">${["DAP", "EXW", "FCA", "CPT", "DDP"].map((m) => `<option ${m === r.incoterm ? "selected" : ""}>${m}</option>`).join("")}</select></div>
        <div class="fld"><label for="f-dep">Départ le</label><input id="f-dep" type="date" value="${(r.departure || inDays(1)).toISOString().slice(0, 10)}"></div>
        <div class="fld"><label for="f-track">N° de suivi</label><input id="f-track" value="${esc(r.tracking || "")}" placeholder="facultatif"></div></div>
      <div class="actions"><button class="btn accent" type="button" data-act="plan">Confirmer le transport (attente enlèvement)</button><button class="btn" type="button" data-act="remind">✉ Relance transporteur (brouillon)</button></div>`;
    if (s.key === "docs") return `<div class="muted">Étiquette de transport, confirmation et n° de suivi sont publiés sur la page de suivi du demandeur, qui les télécharge lui-même : aucun mail ne lui est envoyé.</div>`;
    return `<div class="actions">${r.state === "attente enlèvement" ? '<button class="btn go" type="button" data-act="depart-modal">Valider l\'enlèvement (expédié aujourd\'hui)</button>' : ""}<button class="btn" type="button" data-pl="${esc(r.pl || "")}" ${r.pl ? "" : "disabled"}>Ouvrir l'expédition (packing list)</button></div>
      <div class="fld"><label for="f-notes">Notes internes</label><textarea id="f-notes" rows="2" placeholder="Cotations reçues, choix, n° d'expédition…"></textarea></div>`;
  };
  const tabs = [["suivi", "Suivi"], ["corriger", "Corriger la demande"], ["marchandise", "Marchandise et colis"], ["douane", "Douane (codes HS)"]];
  let right = "";
  if (ui.modalTab === "suivi") right = `<div class="right-head"><h3>Traitement de la demande</h3>${stateChip(r.state)}<span class="next">Prochaine action : <b>${esc(cur ? cur.title.toLowerCase() : "aucune")}</b></span></div>
      ${r.notices.length ? `<div class="notices ${r.notices.some((n) => n.alert) ? "alert" : ""}">${r.notices.map((n) => `<div class="notice"><div class="h">💬 ${esc(n.title)} ${n.isNew ? '<span class="new-tag">NOUVEAU</span>' : ""}</div><div class="x">${esc(n.text)}</div></div>`).join("")}</div>` : ""}
      <div class="actions"><span class="hint" style="flex:1">Une information manque ? Posez la question : le demandeur répond sur sa page de suivi.</span><button class="btn" type="button" data-act="ask">Poser une question au demandeur…</button></div>
      ${st.map((s) => `<div class="step ${s.done ? "done" : ""} ${s.cur ? "cur" : ""}" id="step-${s.key}"><button type="button" data-step="${s.key}" aria-expanded="${open === s.key}"><span class="dot">${s.done ? "✓" : s.n}</span><span class="ttl">${s.title}</span><span class="inf">${esc(s.info)}</span><span>${open === s.key ? "▾" : "▸"}</span></button>${open === s.key ? `<div class="body">${body(s)}</div>` : ""}</div>`).join("")}`;
  if (ui.modalTab === "corriger") right = `<div class="card pad" style="display:flex;flex-direction:column;gap:12px">${["from", "to"].map((side) => `<div><div class="caps">${side === "from" ? "De (expéditeur)" : "À (destinataire)"}</div><div class="form-grid">
      <div class="fld"><label>Société *</label><input id="p-${side}-company" value="${esc(r[side].company)}"></div><div class="fld"><label>Adresse *</label><input value="${esc(r[side].address || "")}" placeholder="Rue et numéro"></div>
      <div class="fld"><label>Ville *</label><input id="p-${side}-city" value="${esc(r[side].city)}"></div><div class="fld"><label>Pays *</label><input value="${esc(r[side].country)}"></div></div></div>`).join("")}</div>`;
  if (ui.modalTab === "marchandise") right = `<div class="card tablewrap"><table class="grid" id="goods-table"><thead><tr><th>Désignation</th><th class="num">Qté</th><th>Code HS</th><th>Nature</th><th class="num">Valeur unit.</th></tr></thead><tbody>
      ${r.goods.map((g, i) => `<tr><td>${esc(g.label)}</td><td class="num">${g.qty}</td><td class="mono">${esc(g.hs)}</td><td>${esc(g.nature)}</td><td class="num"><input id="g-val-${i}" style="width:110px;text-align:right" value="${r.value == null ? "" : (r.value / r.goods.reduce((s, x) => s + x.qty, 0)).toFixed(2)}" placeholder="à saisir"></td></tr>`).join("")}</tbody></table></div>
      <div class="card tablewrap"><table class="grid" id="pk-table"><thead><tr><th class="num">Nombre</th><th>Type</th><th class="num">L</th><th class="num">l</th><th class="num">H</th><th class="num">Poids brut / u</th></tr></thead><tbody>
      ${r.packages.map((p) => `<tr><td class="num">${p.count}</td><td>${esc(p.type)}</td><td class="num">${p.dims[0]}</td><td class="num">${p.dims[1]}</td><td class="num">${p.dims[2]}</td><td class="num">${kg(p.kg)}</td></tr>`).join("")}</tbody></table></div>`;
  if (ui.modalTab === "douane") right = `<div class="card tablewrap"><table class="grid"><thead><tr><th>Article</th><th>Code HS proposé</th><th>Origine</th><th>Statut</th></tr></thead><tbody>
      ${r.goods.map((g) => `<tr><td>${esc(g.label)}</td><td class="mono">${esc(g.hs)}</td><td>${r.kind === "Export" ? "Suisse" : esc(r.from.country)}</td><td>${g.hs === "à déterminer" ? '<span class="chip st-todo">à classer</span>' : '<span class="chip st-done">confirmé</span>'}</td></tr>`).join("")}</tbody></table>
      <div class="pad muted small">La valeur en douane vient toujours de la facture jointe, jamais du catalogue produits.</div></div>`;
  return `<div class="modal-bg" data-close-bg="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Demande ${esc(r.number)}">
    <div class="modal-title"><span>Demande</span><b>${esc(r.number)}</b><span class="sp"></span><button class="btn" type="button" data-act="close-modal">Fermer ✕</button></div>
    <div class="modal-body"><div class="card pad">${overview(r, { inModal: true })}<div class="hint" style="margin-top:8px">Double-cliquez une zone pour la modifier.</div></div>
      <div class="right"><div class="tabs">${tabs.map(([k, l]) => `<button type="button" class="${ui.modalTab === k ? "on" : ""}" data-mtab="${k}">${l}</button>`).join("")}</div>${right}</div></div></div></div>`;
}

/* ───────────────────────── packing lists ───────────────────────── */
const PL_STATES = { draft: ["À conditionner", "st-todo"], ready: ["Prête", "st-prog"], waiting: ["Attente départ", "st-wait"], gone: ["Partie", "st-done"] };
function viewPacking() {
  const counts = Object.keys(PL_STATES).map((k) => [k, S.packingLists.filter((p) => p.state === k).length]);
  return `<div class="page-head"><h1>Packing lists</h1><p>Un dossier par envoi : conditionnement, colis, documents et lien avec la demande de transport.</p></div>
  <div class="state-tiles" id="tour-pl">${counts.map(([k, n]) => `<div class="state-tile" style="border-left-color:var(--${PL_STATES[k][1].slice(3)}-fg)"><div class="n">${n}</div><div class="muted small">${PL_STATES[k][0]}</div></div>`).join("")}
    <div class="state-tile" style="border-left-color:var(--accent)"><div class="n">${S.packingLists.filter((p) => p.departure && Math.abs((p.departure - today) / 864e5) < 7 && p.state !== "gone").length}</div><div class="muted small">Départs cette semaine</div></div></div>
  <div class="card tablewrap"><table class="grid"><thead><tr><th>Référence</th><th>Titre</th><th>Statut</th><th>Destination</th><th>Mode</th><th>Conditionnement</th><th>Transport · départ</th><th>Demande</th><th class="num">Documents</th></tr></thead><tbody>
  ${S.packingLists.map((p) => { const pct = p.state === "draft" ? p.packed / p.items : 1;
    return `<tr><td class="mono"><b>${esc(p.ref)}</b></td><td>${esc(p.title)}</td><td><span class="chip ${PL_STATES[p.state][1]}">${PL_STATES[p.state][0]}</span></td><td>${esc(p.dest)}<div class="muted small">${esc(p.client)}</div></td><td>${esc(p.mode)}</td>
    <td><div class="prog-cell"><div class="bar"><i style="width:${Math.round(pct * 100)}%"></i></div><span class="small num">${p.state === "draft" ? `${p.packed}/${p.items}` : `${p.packages} colis · ${kg(p.kg)}`}</span></div></td>
    <td>${esc(p.carrier || "à choisir")}<div class="muted small">${p.departure ? (p.state === "gone" ? "parti le " : "départ ") + dfmt(p.departure) : "date à fixer"}</div></td>
    <td>${p.request ? `<button class="link" type="button" data-open-number="${esc(p.request)}">🚚 ${esc(p.request)}</button>` : '<span class="muted">aucune</span>'}</td><td class="num">📎 ${p.docs}</td></tr>`; }).join("")}
  </tbody></table></div>
  <div class="hint">Le lien fonctionne dans les deux sens : la demande ouvre son dossier packing list, et le dossier ouvre sa demande. Les pièces jointes sont regroupées dans un même dossier d'archives.</div>`;
}

/* ───────────────────────── déchets ───────────────────────── */
function art(kind, n = 1) {
  const s = (inner, vb = "0 0 120 80") => `<svg viewBox="${vb}" role="img" aria-hidden="true">${inner}</svg>`;
  const A = { fill: "var(--accent)", ink: "var(--fg)", soft: "var(--surface)", muted: "var(--muted)" };
  switch (kind) {
    case "benne": return s(`<path d="M10 30 L110 30 L98 66 L22 66 Z" fill="#2f6f9f" stroke="${A.ink}" stroke-width="2"/><rect x="20" y="66" width="10" height="6" fill="${A.ink}"/><rect x="90" y="66" width="10" height="6" fill="${A.ink}"/><path d="M28 30 l8 -12 l10 6 l12 -10 l12 9 l10 -6 l8 13" fill="#a3a3a3" stroke="${A.ink}" stroke-width="1.5"/>`);
    case "cont": return s(`<rect x="34" y="18" width="52" height="50" rx="4" fill="#3f8f4f" stroke="${A.ink}" stroke-width="2"/><rect x="30" y="12" width="60" height="8" rx="3" fill="#2f6f3c" stroke="${A.ink}" stroke-width="2"/><circle cx="44" cy="72" r="5" fill="${A.ink}"/><circle cx="76" cy="72" r="5" fill="${A.ink}"/>`);
    case "palox": return s(`<rect x="22" y="20" width="76" height="40" rx="3" fill="#2563eb" stroke="${A.ink}" stroke-width="2"/><path d="M22 34 H98 M22 47 H98" stroke="#1e40af" stroke-width="2"/><rect x="22" y="60" width="76" height="8" fill="#1e3a8a"/><rect x="28" y="68" width="10" height="6" fill="${A.ink}"/><rect x="82" y="68" width="10" height="6" fill="${A.ink}"/>`);
    case "paloxv": return s(`<rect x="22" y="20" width="76" height="40" rx="3" fill="#16a34a" stroke="${A.ink}" stroke-width="2"/><path d="M60 26 l12 20 h-24 z" fill="#fde047" stroke="${A.ink}" stroke-width="1.5"/><text x="60" y="44" font-size="12" text-anchor="middle" font-weight="800" fill="${A.ink}">!</text><rect x="22" y="60" width="76" height="8" fill="#14532d"/><rect x="28" y="68" width="10" height="6" fill="${A.ink}"/><rect x="82" y="68" width="10" height="6" fill="${A.ink}"/>`);
    case "sac": return s(`<path d="M38 22 Q60 12 82 22 L90 70 Q60 78 30 70 Z" fill="#cbd5e1" fill-opacity=".75" stroke="${A.ink}" stroke-width="2"/><path d="M52 18 q8 -10 16 0" fill="none" stroke="${A.ink}" stroke-width="2"/>`);
    case "sacbleu": return s(`<path d="M38 22 Q60 12 82 22 L90 70 Q60 78 30 70 Z" fill="#3b82f6" stroke="${A.ink}" stroke-width="2"/><path d="M52 18 q8 -10 16 0" fill="none" stroke="${A.ink}" stroke-width="2"/>`);
    case "izibag": return s(`<rect x="28" y="22" width="64" height="48" fill="#f8fafc" stroke="${A.ink}" stroke-width="2"/><path d="M28 22 l-6 -8 M92 22 l6 -8 M28 70 v-48 M92 70 v-48" stroke="${A.ink}" stroke-width="2"/><rect x="40" y="38" width="40" height="12" fill="#ef4444"/><text x="60" y="47.5" font-size="9" text-anchor="middle" font-weight="800" fill="#fff">1 m³</text>`);
    case "carton": return s(`<path d="M24 34 L60 22 L96 34 L96 66 L60 76 L24 66 Z" fill="#c8915b" stroke="${A.ink}" stroke-width="2"/><path d="M24 34 L60 46 L96 34 M60 46 V76" stroke="${A.ink}" stroke-width="2" fill="none"/>`);
    case "plast": return s(`<path d="M44 20 h14 v8 q10 4 10 14 v28 h-34 v-28 q0 -10 10 -14z" fill="#7dd3fc" stroke="${A.ink}" stroke-width="2"/><path d="M76 34 h20 l-2 36 h-16 z" fill="#a5b4fc" stroke="${A.ink}" stroke-width="2"/>`);
    case "bois": return s(`<rect x="18" y="30" width="84" height="14" rx="3" fill="#b07a47" stroke="${A.ink}" stroke-width="2"/><rect x="26" y="48" width="70" height="14" rx="3" fill="#9a6538" stroke="${A.ink}" stroke-width="2"/><circle cx="30" cy="37" r="4" fill="none" stroke="#5b3a1d" stroke-width="1.5"/>`);
    case "metal": return s(`<path d="M24 60 L54 30 L66 42 L36 72 Z" fill="#9ca3af" stroke="${A.ink}" stroke-width="2"/><rect x="62" y="44" width="36" height="22" fill="#cbd5e1" stroke="${A.ink}" stroke-width="2"/><path d="M62 52 h36 M62 59 h36" stroke="${A.ink}" stroke-width="1"/>`);
    case "resine": return s(`<rect x="40" y="18" width="40" height="54" rx="6" fill="#f97316" stroke="${A.ink}" stroke-width="2"/><rect x="52" y="12" width="16" height="8" fill="${A.ink}"/><path d="M60 32 l12 20 h-24 z" fill="#fde047" stroke="${A.ink}" stroke-width="1.5"/>`);
    case "menager": return s(`<path d="M36 26 h48 l-6 46 h-36 z" fill="#475569" stroke="${A.ink}" stroke-width="2"/><rect x="32" y="20" width="56" height="7" rx="3" fill="#334155" stroke="${A.ink}" stroke-width="2"/>`);
    case "pile": { const k = Math.max(1, Math.min(12, n)); const h = Math.min(6, 64 / k);
      let g = ""; for (let i = 0; i < k; i++) { const y = 72 - (i + 1) * h; g += `<rect x="30" y="${y.toFixed(1)}" width="60" height="${(h - 1).toFixed(1)}" fill="#b07a47" stroke="${A.ink}" stroke-width="1"/>`; }
      return s(g + `<text x="104" y="74" font-size="13" font-weight="800" text-anchor="end" fill="${A.ink}">${n}</text>`); }
    case "feuillard": return s(`<circle cx="60" cy="44" r="26" fill="#e5e7eb" stroke="${A.ink}" stroke-width="2"/><circle cx="60" cy="44" r="10" fill="${A.soft}" stroke="${A.ink}" stroke-width="2"/><path d="M84 54 q16 6 24 16" stroke="#e5e7eb" stroke-width="7" fill="none"/>`);
    default: return s(`<rect x="30" y="20" width="60" height="50" rx="6" fill="${A.fill}"/>`);
  }
}

function viewWaste() {
  const L = S.waste.lines;
  const card = (w) => { const line = L[w[0]] || { qty: 0, container: w[4][0] || "" };
    return `<div class="wcard ${line.qty ? "on" : ""}"><div class="art">${art(w[3], w[3] === "pile" ? Math.max(1, line.qty) : 1)}</div><div class="nm">${esc(w[1])}</div><div class="ds">${esc(w[2])}</div>
      ${w[4].length ? `<select data-cont="${w[0]}" aria-label="Contenant pour ${esc(w[1])}">${w[4].map((c) => `<option ${c === line.container ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>` : '<span class="muted small">en pile, sans contenant</span>'}
      <div class="counter"><button type="button" data-q="${w[0]}" data-d="-1" aria-label="Moins">−</button><b>${line.qty}</b><button type="button" data-q="${w[0]}" data-d="1" aria-label="Plus">+</button><span class="muted small">${w[3] === "pile" ? "palette(s)" : "contenant(s)"}</span></div></div>`; };
  const ccard = (c) => { const line = L[c[0]] || { qty: 0 };
    return `<div class="wcard ${line.qty ? "on" : ""}"><div class="art">${art(c[3])}</div><div class="nm">${esc(c[1])}</div><div class="ds">${esc(c[2])}</div>
      <div class="counter"><button type="button" data-q="${c[0]}" data-d="-1" aria-label="Moins">−</button><b>${line.qty}</b><button type="button" data-q="${c[0]}" data-d="1" aria-label="Plus">+</button></div></div>`; };
  const chosen = WASTES.filter((w) => (L[w[0]] || {}).qty).map((w) => w[3] === "pile" ? `• ${L[w[0]].qty} palettes : ${w[1]} (en pile, sans contenant)` : `• ${L[w[0]].qty} × ${L[w[0]].container || w[4][0]} : ${w[1]}`);
  const cons = CONSUMABLES.filter((c) => (L[c[0]] || {}).qty).map((c) => `• ${L[c[0]].qty} × ${c[1]} (${c[2]})`);
  return `<div class="page-head"><h1>Gestion des déchets</h1><p>Nouvelle demande d'enlèvement : choisir les déchets, le contenant et la quantité.</p></div>
  <div class="section-title"><h2>Déchets à évacuer</h2><span class="muted small">Contenants autorisés par type de déchet · échange du contenant vide décoché par défaut</span></div>
  <div class="waste-grid" id="tour-waste">${WASTES.map(card).join("")}</div>
  <div class="section-title"><h2>Consommables à livrer</h2></div>
  <div class="waste-grid">${CONSUMABLES.map(ccard).join("")}</div>
  <div class="actions"><button class="btn accent" type="button" data-act="waste-mail" ${chosen.length + cons.length ? "" : "disabled"}>✉ Préparer le brouillon pour le prestataire</button><button class="btn" type="button" data-act="waste-clear">Vider la demande</button></div>
  ${ui.wasteMail && chosen.length + cons.length ? `<div class="mail"><div class="mh"><span>À</span><span>enlevements@eco-valor.example</span><span>Objet</span><span>Demande d'enlèvement · Alpenklang SA · ${dfmt(today)}</span><span>État</span><span><span class="draft-tag">BROUILLON dans Outlook</span> à relire puis envoyer</span></div>
    <pre>Bonjour,\n\nMerci de prévoir l'enlèvement suivant à notre adresse (Chemin des Artisans 14, 1227 Carouge) :\n\n${esc(chosen.join("\n"))}${cons.length ? `\n\nEt la livraison de :\n${esc(cons.join("\n"))}` : ""}\n\nAccès par le quai B, du lundi au jeudi de 8 h à 16 h.</pre><div class="sig">${esc(SIGN).replace(/\n/g, "<br>")}</div></div>` : ""}
  <div class="card tablewrap"><table class="grid"><thead><tr><th>Date</th><th>Demande</th><th>État</th></tr></thead><tbody>${S.waste.history.map((h) => `<tr><td class="num">${esc(h.date)}</td><td>${esc(h.lines)}</td><td><span class="chip ${h.state === "Enlevée" ? "st-done" : "st-prog"}">${esc(h.state)}</span></td></tr>`).join("")}</tbody></table></div>`;
}

/* ───────────────────────── fenêtre d'alerte ───────────────────────── */
function alertsView() {
  if (!S.alerts.length) return "";
  const news = S.alerts.filter((a) => a.kind === "new").length, upd = S.alerts.length - news;
  return `<div class="alert-win" role="alertdialog" aria-label="Alerte GoldLog"><div class="ah">🔔 <span>${[news ? `${news} nouvelle(s) demande(s)` : "", upd ? `${upd} demande(s) modifiée(s)` : ""].filter(Boolean).join(" · ")}</span><span class="sp"></span><button type="button" data-act="alerts-close" aria-label="Fermer">×</button></div>
    <div class="ab">${S.alerts.map((a) => { const r = reqByNumber(a.number);
      return `<div class="acard ${a.kind === "new" ? "" : "upd"}"><b>${a.kind === "new" ? "🆕" : "✏️"} ${esc(a.number)} · ${a.kind === "new" ? "nouvelle demande" : "modifiée par " + esc(a.by)}</b><span class="muted small">${esc(r ? `${r.from.city} → ${r.to.city} · ${r.to.company}` : "")}</span>
      <div class="chg">${a.changes.map((c) => "• " + esc(c)).join("\n")}</div><div class="actions" style="justify-content:flex-end"><button class="btn accent" type="button" data-alert-open="${esc(a.number)}">Ouvrir la demande</button></div></div>`; }).join("")}</div></div>`;
}

    <div class="tb"><button class="btn ghost" type="button" data-act="tour-end">Quitter</button><span class="sp"></span>${ui.tour ? '<button class="btn" type="button" data-act="tour-prev">◂ Précédent</button>' : ""}
    <button class="btn accent" type="button" data-act="${ui.tour === TOUR.length - 1 ? "tour-end" : "tour-next"}">${ui.tour === TOUR.length - 1 ? "Terminer" : "Suivant ▸"}</button></div></div>`;

function placeTour() {
  const box = $("#tour-box"); if (!box) return;
  $$(".tour-focus").forEach((e) => e.classList.remove("tour-focus"));
  const target = $(TOUR[ui.tour].el);
  if (!target) { box.style.left = "50%"; box.style.top = "120px"; box.style.transform = "translateX(-50%)"; return; }

/* ───────────────────────── liaisons ───────────────────────── */
function bindCommon(root) {

  $$("[data-go]", root).forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
  $$("[data-open]", root).forEach((b) => { b.addEventListener("click", () => openRequest(+b.dataset.open)); b.addEventListener("keydown", (e) => { if (e.key === "Enter") openRequest(+b.dataset.open); }); });

  $$("[data-pl]", root).forEach((b) => b.addEventListener("click", () => { ui.modal = null; go("packing"); }));
  $$("[data-file]", root).forEach((b) => b.addEventListener("click", () => toast(`« ${b.dataset.file} » ouvert (simulation).`)));
  $$("[data-zone]", root).forEach((z) => z.addEventListener("dblclick", (e) => { e.preventDefault(); focusZone(z.dataset.zone); }));
}

    const line = S.waste.lines[k] || { qty: 0, container: w ? w[4][0] || "" : "" }; line.qty = Math.max(0, Math.min(40, line.qty + +b.dataset.d)); S.waste.lines[k] = line; render(); }));

  $$(".hsec[data-sec]", root).forEach((sec) => {

      const tiles = ui.layout.sections[+sec.dataset.sec].tiles; const at = over && over.dataset.drag !== k ? tiles.indexOf(over.dataset.drag) : -1;

  const sf = $("#settings-form", root); if (sf) { sf.addEventListener("submit", (e) => { e.preventDefault(); S.settings.signature = $("#st-sign").value; log("Paramétrage", "Réglages enregistrés"); toast("Réglages enregistrés."); });
    $$("input[name=theme]", sf).forEach((r) => r.addEventListener("change", () => { if (r.value) document.documentElement.dataset.theme = r.value; else delete document.documentElement.dataset.theme; })); }
  $$("[data-restore]", root).forEach((b) => b.addEventListener("click", () => { ui.restore = +b.dataset.restore; render(); }));
